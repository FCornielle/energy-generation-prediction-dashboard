name: default
endpoint_name: solar-endpoint

model: azureml:solar-generation-model:1

code_configuration:
  code: ./src
  scoring_script: score.py

environment:
  name: solar-env
  image: mcr.microsoft.com/azureml/minimal-ubuntu20.04-py38-cpu-inference:latest
  conda_file: .github/environments/env.yml

instance_type: Standard_DS2_v2

scale_settings:
  type: default
  min_instances: 0
  max_instances: 1
  idle_time_before_scale_down: 5m
