$schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json
name: energy-dashboard-env
version: 1

# Use the Azure ML–supported Python 3.11 inference image
docker:
  base_image: mcr.microsoft.com/azureml/curated/minimal-py311-inference:14

# Then layer on your conda/pip deps
conda:
  channels:
    - conda-forge
  dependencies:
    - python=3.11
    - pip
    - pip:
      - azureml-defaults
      - scikit-learn==1.5.2
      - joblib==1.5.0
      - pandas==2.2.3
      - numpy==2.1.3
